<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta de vista previa</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Lienzo de 1200x630, la proporción que piden LinkedIn, WhatsApp y X. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #F8F4F0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #2C2A29;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .orb--1 { width: 560px; height: 560px; top: -200px; right: -140px;
            background: #F0E4E1; filter: blur(110px); }
  .orb--2 { width: 460px; height: 460px; bottom: -220px; left: -140px;
            background: #EDE6DF; filter: blur(110px); }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(44,42,41,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(44,42,41,.07) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 70% at 40% 50%, #000 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 40% 50%, #000 20%, transparent 80%);
  }

  .wrap {
    position: relative; z-index: 2;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 380px;
    align-items: center;
    gap: 56px;
    padding: 64px 68px;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px 8px 14px;
    border: 1px solid rgba(44,42,41,.14);
    border-radius: 999px;
    background: #FFFFFF;
    font-size: 19px; color: #6B6560;
    margin-bottom: 26px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #7C8A5C;
         box-shadow: 0 0 0 5px rgba(124,138,92,.20); }

  h1 { font-family: 'Satoshi', sans-serif; font-size: 66px; font-weight: 900;
       line-height: 1.02; letter-spacing: -.035em; margin-bottom: 16px; }

  .role { font-family: 'IBM Plex Mono', monospace; font-size: 24px;
          color: #976350; margin-bottom: 32px; letter-spacing: .01em; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 660px; }
  .chip { padding: 8px 16px; border-radius: 999px; font-size: 18px; font-weight: 500;
          border: 1px solid #C9B8A8; background: #FFFFFF; color: #6B6560; }

  .photo {
    width: 380px; height: 380px;
    border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(44,42,41,.14);
    box-shadow: 0 24px 60px rgba(44,42,41,.16);
    position: relative;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { content:""; position:absolute; inset:0;
                  background: linear-gradient(150deg, rgba(160,105,85,.12), transparent 45%); }

  .url {
    position: absolute; left: 68px; bottom: 46px; z-index: 3;
    font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500;
    color: #976350; letter-spacing: .04em;
  }
</style>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="grid"></div>

  <div class="wrap">
    <div>
      <div class="eyebrow"><span class="dot"></span> Disponible para trabajar</div>
      <h1>Maria Mercedes Atim</h1>
      <div class="role">Full Stack Developer</div>
      <div class="chips">
        <span class="chip">Java 17</span>
        <span class="chip">Spring Boot</span>
        <span class="chip">Laravel</span>
        <span class="chip">Vue 3</span>
        <span class="chip">React</span>
        <span class="chip">PostgreSQL</span>
        <span class="chip">Docker</span>
        <span class="chip">Testing &amp; CI/CD</span>
      </div>
    </div>
    <div class="photo"><img src="../assets/Mer.jpeg" alt=""></div>
  </div>

  <div class="url">meratim.github.io</div>
</body>
</html>
